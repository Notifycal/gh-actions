on:
  push:
    branches:
      - main

name: release-please
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    name: Release ${{ github.event.repository.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: googleapis/release-please-action@v5
        with:
          release-type: simple
